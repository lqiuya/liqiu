<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>个人网站记录 | PERSONAL WEBSITE RECORD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-red: #ff003c;
    --neon-pink: #ff2a6d;
    --neon-blue: #05d9e8;
    --neon-yellow: #fcee0a;
    --dark-bg: #0a0a0f;
    --darker: #050508;
    --panel-bg: rgba(10,10,15,0.85);
    --grid-line: rgba(255,0,60,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100%; height: 100%;
    background: var(--darker);
    overflow: hidden;
    font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
    color: #e8e8e8;
  }

  /* ===== 赛博闪屏进场 ===== */
  #cyber-intro {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glitch-lines {
    position: absolute;
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  .glitch-line {
    position: absolute;
    width: 100%; height: 2px;
    background: var(--neon-red);
    opacity: 0;
  }

  .glitch-line:nth-child(1) { top: 15%; animation: glitchFlash 0.08s ease 0.1s forwards; }
  .glitch-line:nth-child(2) { top: 35%; animation: glitchFlash 0.06s ease 0.25s forwards; background: var(--neon-blue); }
  .glitch-line:nth-child(3) { top: 55%; animation: glitchFlash 0.1s ease 0.4s forwards; }
  .glitch-line:nth-child(4) { top: 75%; animation: glitchFlash 0.07s ease 0.55s forwards; background: #fff; }
  .glitch-line:nth-child(5) { top: 90%; animation: glitchFlash 0.09s ease 0.7s forwards; background: var(--neon-pink); }

  @keyframes glitchFlash {
    0% { opacity: 0; transform: translateX(-100%); }
    50% { opacity: 1; transform: translateX(0); }
    100% { opacity: 0; transform: translateX(100%); }
  }

  .noise-overlay {
    position: absolute;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,0,60,0.03) 2px,
      rgba(255,0,60,0.03) 4px
    );
    animation: noiseAppear 1.2s ease forwards;
  }

  @keyframes noiseAppear {
    0%, 100% { opacity: 0; }
    10%, 90% { opacity: 1; }
  }

  .intro-text {
    position: relative; z-index: 10;
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    text-align: center;
    opacity: 0;
    animation: textGlitchIn 0.15s ease 0.85s forwards;
  }

  .intro-text .main-title {
    display: block;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 900;
    color: var(--neon-red);
    text-shadow: 0 0 30px rgba(255,0,60,0.6);
    letter-spacing: 0.3em;
    position: relative;
  }

  .intro-text .main-title::before,
  .intro-text .main-title::after {
    content: '个人网站记录';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
  }

  .intro-text .main-title::before {
    color: var(--neon-blue);
    animation: glitchCyan 0.1s ease 0.9s forwards;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
  }

  .intro-text .main-title::after {
    color: var(--neon-red);
    animation: glitchRed 0.1s ease 0.95s forwards;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  }

  @keyframes textGlitchIn {
    0% { opacity: 0; transform: scale(0.8); filter: blur(20px); }
    50% { opacity: 1; transform: scale(1.02); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes glitchCyan {
    0% { opacity: 0; transform: translateX(-5px); }
    50% { opacity: 0.8; transform: translateX(5px); }
    100% { opacity: 0; }
  }

  @keyframes glitchRed {
    0% { opacity: 0; transform: translateX(5px); }
    50% { opacity: 0.8; transform: translateX(-5px); }
    100% { opacity: 0; }
  }

  .intro-text {
    animation: textGlitchIn 0.15s ease 0.85s forwards,
               textVanish 0.2s ease 1.1s forwards;
  }

  @keyframes textVanish {
    0% { opacity: 1; filter: blur(0); }
    30% { opacity: 1; filter: blur(2px) brightness(2); }
    50% { opacity: 0.8; transform: scale(1.1) skewX(-5deg); filter: blur(5px); }
    100% { opacity: 0; transform: scale(1.3); filter: blur(20px) brightness(3); }
  }

  .final-flash {
    position: absolute; width: 100%; height: 100%;
    background: var(--neon-red);
    opacity: 0;
    animation: finalFlash 0.15s ease 1.25s forwards;
  }

  @keyframes finalFlash {
    0% { opacity: 0; }
    50% { opacity: 0.3; }
    100% { opacity: 0; }
  }

  .scan-out {
    position: absolute; width: 100%; height: 3px;
    background: var(--neon-red);
    box-shadow: 0 0 20px var(--neon-red), 0 0 60px rgba(255,0,60,0.5);
    top: -5%;
    animation: scanExit 0.4s ease 1.3s forwards;
    opacity: 0;
  }

  @keyframes scanExit {
    0% { top: -5%; opacity: 1; }
    100% { top: 105%; opacity: 0; }
  }

  /* ===== 主页面 ===== */
  #main-content {
    display: none;
    width: 100%; height: 100vh;
    position: relative;
    background: var(--darker);
    overflow: hidden;
  }

  #main-content.active {
    display: block;
    animation: mainFadeIn 0.6s ease forwards;
  }

  @keyframes mainFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 赛博红色粒子背景 */
  #particle-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* 背景网格 */
  .bg-grid {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
    pointer-events: none;
  }

  /* 四角装饰 */
  .corner-deco {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }

  .corner-deco.top-left {
    top: 20px; left: 20px;
    width: 80px; height: 80px;
    border-top: 2px solid var(--neon-red);
    border-left: 2px solid var(--neon-red);
    opacity: 0.5;
  }

  .corner-deco.top-right {
    top: 20px; right: 20px;
    width: 80px; height: 80px;
    border-top: 2px solid var(--neon-red);
    border-right: 2px solid var(--neon-red);
    opacity: 0.5;
  }

  .corner-deco.bottom-left {
    bottom: 20px; left: 20px;
    width: 80px; height: 80px;
    border-bottom: 2px solid var(--neon-red);
    border-left: 2px solid var(--neon-red);
    opacity: 0.5;
  }

  .corner-deco.bottom-right {
    bottom: 20px; right: 20px;
    width: 80px; height: 80px;
    border-bottom: 2px solid var(--neon-red);
    border-right: 2px solid var(--neon-red);
    opacity: 0.5;
  }

  /* 顶部状态栏 */
  .status-bar {
    position: fixed; top: 0; left: 0;
    width: 100%; z-index: 100;
    padding: 8px 30px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.3);
    border-bottom: 1px solid rgba(255,0,60,0.1);
  }

  .status-bar .left { display: flex; gap: 20px; }
  .status-bar .blink { animation: blink 1s step-end infinite; }

  @keyframes blink { 50% { opacity: 0; } }

  /* 主内容区 - 标题上移 */
  .main-area {
    position: relative; z-index: 10;
    width: 100%; height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 80px 40px 40px;
  }

  /* 大标题 - 上移 */
  .main-title-area {
    text-align: center;
    margin-bottom: 30px;
    margin-top: 20px;
  }

  .main-title-text {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.2em;
    line-height: 1.2;
    position: relative;
    display: inline-block;
  }

  .main-title-text .highlight {
    color: var(--neon-red);
    text-shadow: 0 0 20px rgba(255,0,60,0.4);
  }

  .main-title-text::after {
    content: '';
    position: absolute;
    bottom: -15px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 3px;
    background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
  }

  .main-subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(0.8rem, 1.2vw, 1rem);
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.4em;
    margin-top: 25px;
    font-weight: 300;
  }

  /* ===== 思维导图 - 缩小靠左 ===== */
  .mind-map-container {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    padding-left: 10%;
    margin-top: 30px;
  }

  .mind-map {
    display: flex;
    align-items: center;
    gap: 0;
    position: relative;
    transform: scale(0.85);
    transform-origin: left center;
  }

  /* 连接线 */
  .connector-line {
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg, var(--neon-red), rgba(255,0,60,0.2), var(--neon-red));
    position: relative;
    animation: linePulse 3s ease-in-out infinite;
  }

  .connector-line::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    background: var(--neon-red);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--neon-red);
    animation: nodePulse 2s ease-in-out infinite;
  }

  @keyframes linePulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  @keyframes nodePulse {
    0%, 100% { box-shadow: 0 0 5px var(--neon-red); }
    50% { box-shadow: 0 0 20px var(--neon-red), 0 0 40px rgba(255,0,60,0.3); }
  }

  /* 节点按钮 - 点击动画 */
  .node-btn {
    position: relative;
    padding: 14px 28px;
    background: transparent;
    border: 1px solid rgba(255,0,60,0.3);
    color: #fff;
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    clip-path: polygon(
      0 0, calc(100% - 12px) 0,
      100% 12px, 100% 100%,
      12px 100%, 0 calc(100% - 12px)
    );
    overflow: hidden;
  }

  .node-btn::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,0,60,0.15), transparent);
    transition: left 0.5s ease;
  }

  .node-btn:hover::before {
    left: 100%;
  }

  .node-btn:hover {
    border-color: var(--neon-red);
    box-shadow: 0 0 30px rgba(255,0,60,0.2), inset 0 0 20px rgba(255,0,60,0.05);
    transform: translateY(-3px);
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .node-btn:active {
    transform: scale(0.95) translateY(0);
    box-shadow: 0 0 50px rgba(255,0,60,0.4), inset 0 0 30px rgba(255,0,60,0.1);
    border-color: var(--neon-red);
  }

  .node-btn.primary {
    background: rgba(255,0,60,0.08);
    border-color: rgba(255,0,60,0.5);
    font-size: 1rem;
  }

  .node-btn.primary:hover {
    background: rgba(255,0,60,0.15);
  }

  /* 点击动画效果 */
  .node-btn.clicked {
    animation: clickRipple 0.4s ease forwards;
  }

  @keyframes clickRipple {
    0% { transform: scale(1); }
    30% { transform: scale(0.92); box-shadow: 0 0 60px rgba(255,0,60,0.5); }
    60% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* 问号节点 */
  .node-btn.unknown {
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
    font-size: 1.1rem;
    padding: 14px 22px;
  }

  .node-btn.unknown:hover {
    border-color: var(--neon-blue);
    color: var(--neon-blue);
    box-shadow: 0 0 30px rgba(5,217,232,0.15);
  }

  .node-btn.unknown:active {
    transform: scale(0.95);
    box-shadow: 0 0 50px rgba(5,217,232,0.3);
  }

  /* 节点时间标签 */
  .node-time {
    position: absolute;
    top: -24px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    color: var(--neon-red);
    letter-spacing: 0.1em;
    white-space: nowrap;
    opacity: 0.7;
  }

  .node-btn.unknown .node-time {
    color: var(--neon-blue);
  }

  /* 节点下方描述 */
  .node-desc {
    position: absolute;
    bottom: -26px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  /* 底部信息 */
  .bottom-info {
    position: fixed; bottom: 30px;
    left: 50%; transform: translateX(-50%);
    z-index: 10;
    text-align: center;
  }

  .bottom-info .est {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.3em;
  }

  .bottom-info .est span {
    color: var(--neon-red);
    opacity: 0.6;
  }

  /* 弹窗 */
  .modal-overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(10px);
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.active {
    opacity: 1; pointer-events: all;
  }

  .modal-box {
    width: 90%; max-width: 600px;
    background: var(--panel-bg);
    border: 1px solid rgba(255,0,60,0.2);
    position: relative;
    clip-path: polygon(
      0 0, calc(100% - 20px) 0,
      100% 20px, 100% 100%,
      20px 100%, 0 calc(100% - 20px)
    );
    transform: scale(0.95) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .modal-overlay.active .modal-box {
    transform: scale(1) translateY(0);
  }

  .modal-header {
    padding: 20px 30px;
    border-bottom: 1px solid rgba(255,0,60,0.15);
    display: flex; justify-content: space-between; align-items: center;
  }

  .modal-header-title {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    font-size: 1.1rem;
    color: var(--neon-red);
    letter-spacing: 0.1em;
  }

  .modal-close {
    background: none; border: none;
    color: rgba(255,255,255,0.4);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.3s ease;
    font-family: 'Orbitron', sans-serif;
  }

  .modal-close:hover {
    color: var(--neon-red);
  }

  .modal-body {
    padding: 25px 30px;
    max-height: 60vh;
    overflow-y: auto;
  }

  .modal-body p {
    font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.8;
    margin-bottom: 1rem;
  }

  .modal-body h4 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    color: var(--neon-red);
    letter-spacing: 0.15em;
    margin: 1.2rem 0 0.6rem;
    text-transform: uppercase;
  }

  .modal-body ul {
    list-style: none;
    padding: 0;
  }

  .modal-body ul li {
    position: relative;
    padding-left: 1.2rem;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
  }

  .modal-body ul li::before {
    content: '>';
    position: absolute; left: 0;
    color: var(--neon-red);
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
  }

  .modal-footer {
    padding: 15px 30px;
    border-top: 1px solid rgba(255,0,60,0.1);
    display: flex; gap: 8px;
    flex-wrap: wrap;
  }

  .modal-tag {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    color: rgba(255,0,60,0.7);
    padding: 3px 8px;
    border: 1px solid rgba(255,0,60,0.2);
    letter-spacing: 0.05em;
  }

  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-track { background: transparent; }
  .modal-body::-webkit-scrollbar-thumb {
    background: rgba(255,0,60,0.3);
    border-radius: 2px;
  }

  .modal-box .corner {
    position: absolute;
    width: 15px; height: 15px;
    border: 2px solid var(--neon-red);
    opacity: 0.5;
  }
  .modal-box .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .modal-box .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .modal-box .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .modal-box .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  /* 响应式 */
  @media (max-width: 768px) {
    .mind-map-container { padding-left: 5%; }
    .mind-map { transform: scale(0.75); }
    .connector-line { width: 60px; }
    .corner-deco { display: none; }
    .main-title-area { margin-top: 10px; }
  }
</style>

<body>

<!-- 赛博闪屏进场 -->
<div id="cyber-intro">
  <div class="glitch-lines">
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
  </div>
  <div class="noise-overlay"></div>
  <div class="final-flash"></div>
  <div class="scan-out"></div>
  <div class="intro-text">
    <span class="main-title">个人网站记录</span>
  </div>
</div>

<!-- 主内容 -->
<div id="main-content">
  <!-- 赛博红色粒子背景 -->
  <canvas id="particle-canvas"></canvas>

  <div class="bg-grid"></div>

  <!-- 四角装饰 -->
  <div class="corner-deco top-left"></div>
  <div class="corner-deco top-right"></div>
  <div class="corner-deco bottom-left"></div>
  <div class="corner-deco bottom-right"></div>

  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <div class="left">
      <span>SYS: ONLINE</span>
      <span class="blink">REC</span>
      <span>VER: 1.0.0</span>
    </div>
    <div class="right">
      <span>2026.08.10</span>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="main-area">
    <div class="main-title-area">
      <h1 class="main-title-text">个人<span class="highlight">网站</span>记录</h1>
      <p class="main-subtitle">PERSONAL WEBSITE RECORD</p>
    </div>

    <!-- 思维导图节点 - 缩小靠左 -->
    <div class="mind-map-container">
      <div class="mind-map">
        <!-- 节点1：网站成立 -->
        <div style="position: relative;">
          <div class="node-time">2026.08.10</div>
          <button class="node-btn primary" onclick="handleNodeClick(this, 'founding')">
            网站成立
          </button>
          <div class="node-desc">ESTABLISHED</div>
        </div>

        <!-- 连接线 -->
        <div class="connector-line"></div>

        <!-- 节点2：问号 -->
        <div style="position: relative;">
          <div class="node-time">????.??.??</div>
          <button class="node-btn unknown" onclick="handleNodeClick(this, 'unknown')">
            ?
          </button>
          <div class="node-desc">UNKNOWN</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="bottom-info">
    <p class="est">EST. <span>2026.08.10</span> // NIGHT CITY // TO BE CONTINUED</p>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="modal-header">
      <div class="modal-header-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
  // ===== 赛博红色粒子背景 =====
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animationId;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  class Particle {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.5;
      this.speedY = (Math.random() - 0.5) * 0.5;
      this.opacity = Math.random() * 0.5 + 0.2;
      this.life = Math.random() * 100 + 50;
      this.maxLife = this.life;
    }

    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.life--;

      if (this.life <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
        this.reset();
      }
    }

    draw() {
      const lifeRatio = this.life / this.maxLife;
      const alpha = this.opacity * lifeRatio;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 0, 60, ${alpha})`;
      ctx.fill();

      // 发光效果
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 0, 60, ${alpha * 0.1})`;
      ctx.fill();
    }
  }

  function initParticles() {
    particles = [];
    const count = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }
  }

  function drawConnections() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 120) {
          const alpha = (1 - dist / 120) * 0.15;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(255, 0, 60, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.update();
      p.draw();
    });

    drawConnections();
    animationId = requestAnimationFrame(animateParticles);
  }

  initParticles();
  animateParticles();

  // ===== 弹窗内容 =====
  const modalData = {
    founding: {
      title: '网站成立',
      body: `
        <p>2026年8月10日，个人网站正式建立。这是一个记录成长轨迹的空间，从容器安全的第一个实验开始，每一步都将被记录。</p>
        <h4>第一篇文章</h4>
        <p>容器安全之 Linux Namespace 六大隔离机制 —— PID 隔离、网络隔离、挂载隔离、UTS 隔离、IPC 隔离、用户隔离。</p>
        <h4>技术栈</h4>
        <ul>
          <li>Linux Namespace 隔离机制</li>
          <li>Docker 容器基础</li>
          <li>cgroups 资源限制</li>
          <li>Linux Capabilities</li>
          <li>Seccomp BPF 过滤</li>
        </ul>
        <h4>目标</h4>
        <p>从零开始，系统学习容器安全与云原生安全，用 Rust 编写安全工具，16岁开始，哪怕前路的风雨在大.......</p>
      `,
      tags: ['EST.2026.08.10', '记录', 'SECURITY', 'NAMESPACE', 'LINUX']
    },
    unknown: {
      title: '???',
      body: `
        <p>未来的节点尚未解锁。</p>
        <p>当新的里程碑达成时，这里将显示下一个重要事件。</p>
        <h4>待解锁内容</h4>
        <ul>
          <li>第一阶段实验完成</li>
          <li>Rust 容器运行时</li>
          <li>Kubernetes 安全加固</li>
          <li>eBPF 安全探针</li>
          <li>开源项目贡献</li>
        </ul>
      `,
      tags: ['LOCKED', 'FUTURE', 'PENDING']
    }
  };

  // 节点点击动画 + 弹窗
  function handleNodeClick(btn, key) {
    // 添加点击动画类
    btn.classList.add('clicked');

    // 播放点击音效（可选，这里用视觉反馈）
    btn.style.borderColor = 'var(--neon-red)';
    btn.style.boxShadow = '0 0 40px rgba(255,0,60,0.4)';

    setTimeout(() => {
      btn.classList.remove('clicked');
      btn.style.borderColor = '';
      btn.style.boxShadow = '';
      openModal(key);
    }, 300);
  }

  function openModal(key) {
    const data = modalData[key];
    document.getElementById('modalTitle').textContent = data.title;
    document.getElementById('modalBody').innerHTML = data.body;
    document.getElementById('modalFooter').innerHTML = data.tags.map(t =>
      `<span class="modal-tag">${t}</span>`
    ).join('');
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal(event) {
    if (event && event.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('active');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // ===== 进场动画控制 =====
  setTimeout(() => {
    document.getElementById('cyber-intro').style.display = 'none';
    document.getElementById('main-content').classList.add('active');
  }, 1600);
</script>

</body>
</html>
