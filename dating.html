        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #141414;
            --bg-hover: #1a1a1a;
            --red-primary: #ff3333;
            --red-bright: #ff5555;
            --red-dim: #cc2222;
            --red-glow: rgba(255, 51, 51, 0.3);
            --text-primary: #e8e8e8;
            --text-secondary: #999999;
            --text-dim: #666666;
            --border: #222222;
            --border-hover: #333333;
        }

        body {
            font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 粒子画布 */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 扫描线效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 51, 51, 0.02) 2px,
                rgba(255, 51, 51, 0.02) 4px
            );
            z-index: 2;
            pointer-events: none;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 35px 22px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        /* 个人信息 */
        .profile {
            text-align: center;
            margin-bottom: 45px;
            position: relative;
        }

        .profile::after {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--red-primary), transparent);
        }

        .name-box {
            display: inline-block;
            border: 1px solid var(--red-primary);
            border-radius: 4px;
            padding: 14px 32px;
            margin-bottom: 18px;
            background: rgba(255, 51, 51, 0.05);
            position: relative;
            overflow: hidden;
        }

        .name-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 51, 51, 0.2), transparent);
            animation: scan 3s infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .name-box h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            color: var(--red-primary);
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 20px var(--red-glow);
            position: relative;
        }

        .profile-info {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 2.2;
            font-family: 'JetBrains Mono', monospace;
        }

        .profile-info span {
            color: var(--red-bright);
        }

        /* 导航栏 */
        .nav-section {
            flex: 1;
        }

        .nav-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-dim);
            margin-bottom: 18px;
            padding-left: 12px;
            border-left: 2px solid var(--red-primary);
        }

        .nav-item {
            display: block;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 2px solid transparent;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .nav-item:hover {

            color: var(--red-bright);
            border-left-color: var(--red-primary);

            color: var(--red-primary);

            text-shadow: 0 0 10px var(--red-glow);

            }

                padding: 25px 30px;
            }
        }
    </style>

    <script>
        // 粒子特效 - 红色科幻风
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 60;
        const connectionDistance = 150;
        const mouseDistance = 200;

        let mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                if (mouse.x != null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouseDistance) {
                        const force = (mouseDistance - distance) / mouseDistance;
                        this.vx += (dx / distance) * force * 0.015;
                        this.vy += (dy / distance) * force * 0.015;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 51, 51, ${this.opacity})`;
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 51, 51, ${0.15 * (1 - distance / connectionDistance)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        init();
        animate();

        // 搜索功能
        const searchInput = document.getElementById('searchInput');
        const articleList = document.getElementById('articleList');
        const noResults = document.getElementById('noResults');
        const articles = articleList.querySelectorAll('.article-card');

        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            let hasResult = false;

            articles.forEach(article => {
                const title = article.getAttribute('data-title').toLowerCase();
                if (title.includes(keyword)) {
                    article.classList.remove('hidden');
                    hasResult = true;
                } else {
                    article.classList.add('hidden');
                }
            });

            noResults.style.display = hasResult ? 'none' : 'block';
        });
    </script>
